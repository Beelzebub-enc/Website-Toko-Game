<!-- Tailwind Configuration for Gaming Theme -->
<script>
  function initializeTailwind() {
    document.documentElement.style.setProperty('--accent-gold', '#c9a84c');
    
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ml-dark': '#0a0a0a',
            'ml-card': '#111111',
            'ml-gold': '#c9a84c',
            'ml-gold-light': '#e8d48b',
            'ml-red': '#c94c4c',
          },
          fontFamily: {
            'orbitron': ['Orbitron', 'monospace'],
            'sans': ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  }
  window.addEventListener('load', initializeTailwind);
</script>
