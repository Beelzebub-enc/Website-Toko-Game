<svg xmlns="http://www.w3.org/2000/svg" width="616" height="353" viewBox="0 0 616 353">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0600"/>
      <stop offset="100%" stop-color="#6b1212"/>
    </linearGradient>
    <linearGradient id="gld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="48%" stop-color="#e8d48b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8861a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c8861a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><rect width="616" height="353"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="616" height="353" fill="url(#bg)"/>
    <ellipse cx="308" cy="176" rx="300" ry="190" fill="url(#glow)" filter="url(#blur)"/>
    <!-- subtle grid -->
    <g stroke="#c8861a" stroke-width="0.35" opacity="0.065">
      <line x1="0" y1="88" x2="616" y2="88"/><line x1="0" y1="176" x2="616" y2="176"/>
      <line x1="0" y1="264" x2="616" y2="264"/>
      <line x1="77" y1="0" x2="77" y2="353"/><line x1="154" y1="0" x2="154" y2="353"/>
      <line x1="231" y1="0" x2="231" y2="353"/><line x1="308" y1="0" x2="308" y2="353"/>
      <line x1="385" y1="0" x2="385" y2="353"/><line x1="462" y1="0" x2="462" y2="353"/>
      <line x1="539" y1="0" x2="539" y2="353"/>
    </g>
    <!-- diagonal accent -->
    <line x1="0" y1="353" x2="616" y2="0" stroke="#c8861a" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="0" x2="616" y2="353" stroke="#c8861a" stroke-width="0.3" opacity="0.04"/>
    <!-- border frame -->
    <rect x="0" y="0" width="616" height="2" fill="url(#gld)"/>
    <rect x="0" y="351" width="616" height="2" fill="url(#gld)"/>
    <rect x="0" y="0" width="2" height="353" fill="#c8861a" opacity="0.3"/>
    <rect x="614" y="0" width="2" height="353" fill="#c8861a" opacity="0.3"/>
    <!-- corner marks -->
    <path d="M18 18 L52 18 M18 18 L18 52" stroke="url(#gld)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M564 18 L598 18 M598 18 L598 52" stroke="url(#gld)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M18 335 L18 301 M18 335 L52 335" stroke="url(#gld)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M598 335 L598 301 M564 335 L598 335" stroke="url(#gld)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- watermark large code -->
    <text x="308" y="212" font-family="'Courier New',monospace" font-size="48" font-weight="900"
      fill="#c8861a" opacity="0.055" text-anchor="middle" letter-spacing="10">RDR2</text>
    <!-- horizontal accent line -->
    <rect x="18" y="258" width="580" height="0.7" fill="#c8861a" opacity="0.12"/>
    <!-- studio name -->
    <text x="308" y="276" font-family="Arial,sans-serif" font-size="9.5" font-weight="700"
      fill="#c8861a" opacity="0.40" text-anchor="middle" letter-spacing="5">ROCKSTAR GAMES</text>
    <!-- game name shadow -->
    <text x="310" y="224" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700"
      fill="#c8861a" opacity="0.18" text-anchor="middle" letter-spacing="1" filter="url(#blur2)">Red Dead Redemption 2</text>
    <!-- game name -->
    <text x="308" y="222" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700"
      fill="#c9a84c" text-anchor="middle" letter-spacing="1">Red Dead Redemption 2</text>
    <!-- divider -->
    <rect x="200" y="232" width="216" height="0.8" fill="url(#gld)" opacity="0.60"/>
    <!-- market l label -->
    <text x="308" y="250" font-family="Arial,sans-serif" font-size="9.5" font-weight="400"
      fill="rgba(255,255,255,0.22)" text-anchor="middle" letter-spacing="5.5">MARKET L · PREMIUM</text>
    <!-- dot accents -->
    <circle cx="196" cy="222" r="2" fill="#c8861a" opacity="0.35"/>
    <circle cx="420" cy="222" r="2" fill="#c8861a" opacity="0.35"/>
  </g>
</svg>